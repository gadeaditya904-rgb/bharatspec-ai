services:
  # -------------------------------------------------------------
  # BHARATSPEC BACKEND: Python FastAPI REST API
  # -------------------------------------------------------------
  - type: web
    name: bharatspec-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8

  # -------------------------------------------------------------
  # BHARATSPEC FRONTEND: React + Vite Single Page Application
  # -------------------------------------------------------------
  - type: web
    name: bharatspec-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: bharatspec-backend
          property: host
